<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner Atividades</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<script>
  // Aplica o tema salvo antes da pintura, para não piscar o tema errado.
  try{
    var savedTheme = localStorage.getItem("planner-theme");
    if(savedTheme === "light" || savedTheme === "dark"){
      document.documentElement.setAttribute("data-theme", savedTheme);
    }
  }catch(e){}
</script>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="title-block">
      <h1 id="board-title">Atividades</h1>
      <span class="sub" id="task-count-sub">0 tarefas</span>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn theme-toggle" id="theme-toggle" title="Alternar tema claro/escuro" aria-label="Alternar tema claro/escuro">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
      <button class="btn" id="reset-btn" title="Restaurar exemplo">Restaurar exemplo</button>
      <button class="btn primary" id="new-task-top">+ Criar tarefa</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-view="board">Quadro principal</div>
    <div class="tab" data-view="calendar">Calendário</div>
  </div>

  <div id="view-board"></div>
  <div id="view-calendar" style="display:none;"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
